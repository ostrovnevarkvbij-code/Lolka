<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копировщик серверов Lolka</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 10px; }
        h1 { color: #e94560; }
        .login-section, .copy-section { margin-top: 20px; padding: 20px; background: #0f3460; border-radius: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #0f3460; background: #0f3460; color: #fff; }
        button { margin-top: 20px; padding: 12px 25px; background: #e94560; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #c73650; }
        .hidden { display: none; }
        .user-info { margin-top: 10px; font-size: 14px; color: #a0a0a0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Копировщик серверов Lolka</h1>

        <!-- Секция входа -->
        <div id="loginSection" class="login-section">
            <h2>🔑 Вход</h2>
            <p>Введите токен вашего бота Lolka, чтобы войти.</p>
            <label for="botToken">Токен бота:</label>
            <input type="password" id="botToken" placeholder="Вставьте токен бота...">
            <button onclick="login()">Войти</button>
            <p class="user-info">Токен будет сохранен в вашем браузере.</p>
        </div>

        <!-- Секция копирования -->
        <div id="copySection" class="copy-section hidden">
            <h2>📋 Копирование сервера</h2>
            <p>Вы вошли как: <strong id="userName">Пользователь</strong></p>
            <button onclick="logout()" style="background: #555; margin-top: 0;">Выйти</button>

            <label for="sourceId">ID сервера-источника (откуда копировать):</label>
            <input type="text" id="sourceId" placeholder="Например: 123456789">

            <label for="targetId">ID сервера-назначения (куда копировать):</label>
            <input type="text" id="targetId" placeholder="Например: 987654321">

            <button onclick="copyServer()">🚀 Начать копирование</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        // Проверяем, сохранен ли токен при загрузке страницы
        window.onload = function() {
            const savedToken = localStorage.getItem('lolka_bot_token');
            if (savedToken) {
                showCopySection(savedToken);
            }
        };

        function login() {
            const token = document.getElementById('botToken').value.trim();
            if (!token) {
                alert('Введите токен!');
                return;
            }
            // Сохраняем токен в localStorage
            localStorage.setItem('lolka_bot_token', token);
            showCopySection(token);
        }

        function showCopySection(token) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('copySection').classList.remove('hidden');
            // Здесь можно было бы получить имя пользователя через API, но пока просто заглушка
            document.getElementById('userName').textContent = 'Пользователь (токен сохранен)';
        }

        function logout() {
            localStorage.removeItem('lolka_bot_token');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('copySection').classList.add('hidden');
            document.getElementById('botToken').value = '';
        }

        function copyServer() {
            const sourceId = document.getElementById('sourceId').value.trim();
            const targetId = document.getElementById('targetId').value.trim();
            const token = localStorage.getItem('lolka_bot_token');

            if (!sourceId || !targetId) {
                alert('Заполните оба ID!');
                return;
            }

            // Здесь будет код для отправки команды боту.
            // Пока просто показываем статус.
            document.getElementById('status').innerHTML = `
                <p style="color: #e94560;">⏳ Отправка команды боту...</p>
                <p>Источник: ${sourceId}</p>
                <p>Назначение: ${targetId}</p>
                <p><em>(В будущем здесь будет реальный прогресс копирования)</em></p>
            `;
            // TODO: Отправить запрос на ваш бэкенд/бота с token, sourceId, targetId
        }
    </script>
</body>
</html>
